<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#141312" />
    </linearGradient>

    <!-- Letter T Golden-to-White Gradient -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Subtle Amber Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Gradient Border -->
  <rect x="16" y="16" width="480" height="480" rx="136" fill="url(#borderGrad)" />

  <!-- Inner Dark Container matching #141312 -->
  <rect x="30" y="30" width="452" height="452" rx="124" fill="#141312" />

  <!-- Monogram "T" -->
  <path
    d="M136 148 H376 V224 H292 V396 H220 V224 H136 Z"
    fill="url(#letterGrad)"
    filter="url(#glow)"
  />
</svg>
